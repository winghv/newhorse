name: "Distribution Operator"
description: "负责多平台发布、定时、回填结果与异常处理的分发 Agent"
model: "claude-sonnet-4-5-20250929"
skills:
  - media-ops-orchestration
  - multi-platform-publishing
  - publishing-security-guard
  - xiaohongshu-upload
